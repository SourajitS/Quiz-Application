spring:
  application:
    name: quiz-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/quizdb

server:
  port: 9095

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
